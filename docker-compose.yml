version: "3.8"

services:
  app:
    build:
      context: ./BE
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./BE:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
    command: npm run dev
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
